version: '3.8'

services:
  # Backend API service
  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: event-concierge-backend
    ports:
      - "3001:3001"
    environment:
      # Database Configuration
      DATABASE_URL: "mongodb://mongo:27017/event-concierge"
      
      # JWT Configuration
      JWT_SECRET: "your-super-secret-jwt-key-change-in-production"
      JWT_EXPIRES_IN: "7d"
      MAGIC_LINK_EXPIRES_IN: "24h"
      
      # AWS Configuration
      AWS_ACCESS_KEY_ID: "your-aws-access-key-id"
      AWS_SECRET_ACCESS_KEY: "your-aws-secret-access-key"
      AWS_REGION: "ap-south-1"
      AWS_S3_BUCKET: "your-aws-s3-bucket"
      
      # Email Configuration (AWS SES)
      SES_FROM_EMAIL: "noreply@yourdomain.com"
      SES_FROM_NAME: "Event Concierge"
      
      # WhatsApp Configuration (Twilio)
      TWILIO_ACCOUNT_SID: "your-twilio-account-sid"
      TWILIO_AUTH_TOKEN: "your-twilio-auth-token"
      TWILIO_WHATSAPP_FROM: "whatsapp:+1234567890"
      
      # App Configuration
      APP_URL: "http://localhost:3001"
      PORT: "3001"
      NODE_ENV: "development"
    depends_on:
      - mongo
    volumes:
      - ./prisma:/app/prisma:ro
    restart: unless-stopped
    networks:
      - event-concierge-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # MongoDB Database service
  mongo:
    image: mongo:8.0.2-jammy
    container_name: event-concierge-mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "admin"
      MONGO_INITDB_ROOT_PASSWORD: "password"
      MONGO_INITDB_DATABASE: "event-concierge"
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    restart: unless-stopped
    networks:
      - event-concierge-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongo_data:
    driver: local

networks:
  event-concierge-network:
    driver: bridge